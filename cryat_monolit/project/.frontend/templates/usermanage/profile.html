<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/forprofile.css' %}">
    <link rel="icon" href="{% static 'img/logosite.jpg' %}">
    <title>Personal Account - CRYAT</title>
</head>
<body>

    <div class="main">
        <div class="footer">
            <div class="left">
                <a href="{% url 'main:home' %}"><img src="{% static 'img/logo.png' %}"></a>
            </div>
            <div class="right">
                <a href="{% url 'usermanage:setting' user.token %}"><img src="{% static 'img/setting.png' %}"></a>
                <a href="{% url 'main:feedback' %}"><img src="{% static 'img/chat.png' %}"></a>
                
                <form action="{% url 'usermanage:logout' %}" method="POST" class="logout-form">
                    {% csrf_token %}
                    <button type="submit" class="logout-btn">
                        <img src="{% static 'img/logout.png' %}" alt="Logout">
                    </button>
                </form>
            </div>
        </div>

        <div class="main_info">
            <div class="lefter">
                <h1>sup, {{ user.nickname }}</h1>

                {% for chet in wallets %}
                <div class="chet1">
                    <h2>{{ chet.balance }}</h2>
                    <p>{{ chet.wallet_type }} {{ chet.currency }}</p>
                    <p>{{ chet.token }}</p>
                </div>
                {% endfor %}
                
                <div class="btn">
                    <button id="openModal">Create wallet</button>
                    <button id="send">Send</button>
                    <button id="between">Between</button>
                    <button id="exchange">Exchange</button>
                </div>
            </div>
        </div>
    </div>

    <div id="modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close">&times;</span>
            <form id="createwallet" method="POST" action="/operations/createwallet/">
                {% csrf_token %}
                <label for="wallet_type">Account type</label>
                <select id="wallet_type" name="wallet_type" required>
                    <option value="fiat">FIAT</option>
                    <option value="saving">Saving</option>
                </select>

                <label for="currency">Currency</label>
                <select id="currency" name="currency" required>
                    <option value="rub">RUB</option>
                    <option value="usd">USD</option>
                </select>

                <button type="submit">Create</button>
            </form>
        </div>
    </div>

    <div id="sendModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close-send">&times;</span>
            <form id="send" method="POST" action="/operations/send/">
                {% csrf_token %}
                <label for="token">token</label>
                <input type="text" id="token" name="token" required>

                <label for="currency">currency</label>
                <input type="text" id="currency" name="currency" required>
    
                <label for="count">amount</label>
                <input type="text" id="count" name="count" required>
    
                <button type="submit">Send</button>
            </form>
        </div>
    </div>

    <div id="betweenModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close">&times;</span>
            <form id="betweenForm" method="POST" action="/operations/between/">
                {% csrf_token %}

                <label for="wallet_type">Wallet Type to</label>
                <select id="wallet_type" name="wallet_type" required>
                    <option value="fiat">FIAT</option>
                    <option value="saving">Saving</option>
                </select>

                <label for="amount">Amount</label>
                <input type="text" id="amount" name="amount" required>

                <label for="currency">Currency</label>
                <input type="text" id="currency" name="currency" required>

                <button type="submit">Exchange</button>
            </form>
        </div>
    </div>

    <div id="exchangeModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close-send">&times;</span>
            <form id="exchangeForm" method="POST" action="/operations/exchange/">
                {% csrf_token %}
                <label for="currency">Currency</label>
                <input type="text" id="currency" name="currency" required>

                <label for="amount">Amount</label>
                <input type="number" id="amount" name="amount" required>

                <button type="submit">Exchange</button>
            </form>
        </div>
    </div>

    <script src="{% static 'js/modal.js' %}"></script>
    <script src="{% static 'js/operations.js' %}"></script>
    
</body>
</html>
