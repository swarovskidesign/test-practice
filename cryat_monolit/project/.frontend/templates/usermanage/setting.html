<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/forset.css' %}">
    <link rel="icon" href="{% static 'img/logo.jpg' %}">
    <title>Account Settings - CRYAT</title>
</head>
<body>

    <div class="main">
        <div class="header">
            <a href="{% url 'main:home' %}" class="logo"><img src="{% static 'img/logo.png' %}" alt="Logo"></a>
            <div class="header-icons">
                <form action="{% url 'usermanage:logout' %}" method="POST" class="logout-form">
                    {% csrf_token %}
                    <button type="submit" class="logout-btn">
                        <img src="{% static 'img/logout.png' %}" alt="Logout">
                    </button>
                </form>
            </div>
        </div>

        <div class="content">
            <div class="user-info">
                <h1>Welcome, {{ user.nickname }}</h1>
                <p><strong>Email:</strong> {{ user.email }}</p>
                <p><strong>Joined:</strong> {{ user.date_joined }}</p>
            </div>

            <div class="settings">
                <h2>Account Settings</h2>
                <form action="/account/update/" method="POST">
                    {% csrf_token %}
                    <label for="nickname">Nickname</label>
                    <input type="text" id="nickname" name="nickname" value="{{ user.nickname }}" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" value="{{ user.email }}" required>

                    <label for="password">Change Password</label>
                    <input type="password" id="password" name="password">

                    <button type="submit">Save Changes</button>
                </form>
            </div>
        </div>
    </div>

    <script src="{% static 'js/modal.js' %}"></script>
</body>
</html>
